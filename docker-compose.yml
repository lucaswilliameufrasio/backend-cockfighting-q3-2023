services:
  api1:
    build: .
    restart: on-failure
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=fight
      - DB_USER=postgres
      - DB_PASSWORD=fight
      - DB_MAX_CONNECTIONS=16
      - NUM_THREADS=2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - fight-pit
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '0.4GB'

  api2:
    build: .
    restart: on-failure
    environment:
      - PORT=8081
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=fight
      - DB_USER=postgres
      - DB_PASSWORD=fight
      - DB_MAX_CONNECTIONS=16
      - NUM_THREADS=2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health-check"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - fight-pit
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '0.4GB'

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - fight-pit
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: '0.4GB'

  db:
    image: postgres:18.6-alpine
    hostname: db
    container_name: backend-cockfighting-database
    environment:
      - POSTGRES_PASSWORD=fight
      - POSTGRES_DB=fight
    # Passing performance flags directly to avoid config file resolution issues
    command: [
      "postgres",
      "-c", "max_connections=200",
      "-c", "shared_buffers=450MB",
      "-c", "work_mem=1536kB",
      "-c", "maintenance_work_mem=115200kB",
      "-c", "effective_cache_size=1350MB",
      "-c", "wal_buffers=13824kB",
      "-c", "checkpoint_timeout=10min",
      "-c", "checkpoint_completion_target=0.9",
      "-c", "random_page_cost=1.1",
      "-c", "effective_io_concurrency=200",
      "-c", "autovacuum=on",
      "-c", "log_statement=none"
    ]
    volumes:
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fight"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fight-pit
    deploy:
      resources:
        limits:
          cpus: '0.85'
          memory: '1.8GB'

networks:
  fight-pit:
    driver: bridge

volumes:
  postgres_data:
