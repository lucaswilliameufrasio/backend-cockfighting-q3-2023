worker_processes auto;
worker_rlimit_nofile 65536;

events {
    use epoll;
    multi_accept on;
    worker_connections 65535;
}

http {
    access_log off;

    upstream api {
        server api1:8080;
        server api2:8081;
        keepalive 256;
    }

    server {
        listen 9999;
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
