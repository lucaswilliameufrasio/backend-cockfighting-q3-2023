worker_processes auto;
worker_rlimit_nofile 65536;

# LB em L4 (stream): nginx repassa TCP puro sem parsear HTTP.
# Sob quota de 0.15 CPU, o proxy L7 consumia a quota inteira a ~830 rps
# e virava o gargalo; em L4 o custo por request cai ~5x e os APIs
# passam a usar as proprias quotas (mesmo padrao dos repos Go e Rust).
events {
    use epoll;
    multi_accept on;
    worker_connections 65535;
}

stream {
    upstream api {
        server api1:8080;
        server api2:8081;
    }

    server {
        listen 9999;
        proxy_pass api;
    }
}
